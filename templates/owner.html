<!DOCTYPE html>
<html>
<head>
    <title>Super Admin Panel - Luxury Leads AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 0;
        }
        .header {
            background: #020617;
            padding: 20px 40px;
            border-bottom: 2px solid #1e293b;
        }
        .header h2 {
            color: #38bdf8;
            font-size: 24px;
        }
        .header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }
        .container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .section h3 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input, textarea, button { 
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        input {
            flex: 1;
            min-width: 200px;
        }
        textarea {
            width: 100%;
            min-height: 80px;
            resize: vertical;
        }
        button { 
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-create {
            background: #22c55e;
            color: black;
            border: none;
            padding: 12px 30px;
        }
        .btn-create:hover {
            background: #16a34a;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
        }
        .btn-delete:hover {
            background: #dc2626;
        }
        table { 
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td { 
            border: 1px solid #334155;
            padding: 14px;
            text-align: left;
        }
        th { 
            background: #0f172a;
            color: #38bdf8;
            font-weight: bold;
        }
        tr:hover {
            background: #334155;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .status-active {
            color: #22c55e;
            font-weight: bold;
        }
        .status-pending {
            color: #eab308;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px 20px;
        }
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .stat-sub {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        .tier-pill {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tier-solo { background: rgba(56,189,248,0.15); color: #38bdf8; }
        .tier-agency { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .tier-corporation { background: rgba(16,185,129,0.15); color: #34d399; }
        .sub-trialing { color: #eab308; font-weight: bold; }
        .sub-active { color: #22c55e; font-weight: bold; }
        .sub-cancelled { color: #ef4444; font-weight: bold; }
        .trial-expired { color: #ef4444; font-size: 11px; }
        .trial-ok { color: #64748b; font-size: 11px; }
    </style>
</head>
<body>

<div class="header" style="display:flex; justify-content:space-between; align-items:center;">
    <div>
        <h2>⚙️ Super Admin Panel</h2>
        <p>Manage all agencies and their configurations</p>
    </div>
    <a href="/super-admin-logout" style="color:#94a3b8; text-decoration:none; font-size:14px; border:1px solid #334155; padding:8px 16px; border-radius:6px;">🚪 Logout</a>
</div>

<div class="container">

    <div id="statsGrid" class="stats-grid">
        <div class="loading">⏳ Loading overview...</div>
    </div>

    <div class="section">
        <h3>➕ Create New Agency</h3>
        <div class="form-row">
            <input id="name" placeholder="Agency Name (e.g., Elite Properties)">
            <input id="assistant_name" placeholder="AI Assistant Name (e.g., Sophia)">
            <input id="owner_name" placeholder="Owner Name">
        </div>
        <div class="form-row">
            <input id="email" type="email" placeholder="Email Address">
            <input id="whatsapp" placeholder="WhatsApp Number">
        </div>
        <div class="form-row">
            <textarea id="prompt" placeholder="AI Prompt (Optional - Leave empty for default)">You are a luxury real estate assistant.</textarea>
        </div>
        <button class="btn-create" onclick="createAgency()">✨ Create Agency</button>
    </div>

    <div class="section">
        <h3>📋 All Agencies</h3>
        <div id="loading" class="loading">⏳ Loading agencies...</div>
        <table id="agencyTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Agency Name</th>
                    <th>Owner</th>
                    <th>Email</th>
                    <th>Tier</th>
                    <th>Subscription</th>
                    <th>Leads</th>
                    <th>Appts</th>
                    <th>Agents</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="agencyBody">
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
            📭 No agencies created yet. Create your first one above!
        </div>
    </div>

</div>

<script>
async function loadPlatformStats() {
    const grid = document.getElementById("statsGrid");
    try {
        const res = await fetch("/platform-stats");
        const s = await res.json();
        if (!res.ok) throw new Error(s.error || "Failed to load");

        const tierLine = Object.entries(s.by_tier)
            .map(([tier, count]) => `${count} ${tier}`)
            .join(" · ");

        grid.innerHTML = `
            <div class="stat-card">
                <div class="stat-label">Total Agencies</div>
                <div class="stat-value">${s.total_agencies}</div>
                <div class="stat-sub">${tierLine}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Trials</div>
                <div class="stat-value">${s.active_trials}</div>
                <div class="stat-sub">${s.expired_trials} expired, not converted</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Paying Agencies</div>
                <div class="stat-value">${s.paying_agencies}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Leads</div>
                <div class="stat-value">${s.total_leads}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Appointments</div>
                <div class="stat-value">${s.total_appointments}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Agents</div>
                <div class="stat-value">${s.total_agents}</div>
            </div>
        `;
    } catch (error) {
        grid.innerHTML = `<div class="loading">❌ Failed to load overview</div>`;
        console.error("Error loading platform stats:", error);
    }
}

async function loadAgencies() {
    const loading = document.getElementById("loading");
    const table = document.getElementById("agencyTable");
    const emptyState = document.getElementById("emptyState");
    const tbody = document.getElementById("agencyBody");
    
    try {
        const res = await fetch("/agencies");
        const data = await res.json();
        
        loading.style.display = "none";
        
        if (data.length === 0) {
            emptyState.style.display = "block";
            table.style.display = "none";
        } else {
            emptyState.style.display = "none";
            table.style.display = "table";
            
            tbody.innerHTML = "";
            
            data.forEach(a => {
                const createdDate = new Date(a.created_at).toLocaleDateString();
                const tier = a.tier || "solo";

                let subHtml;
                if (a.subscription_status === "trialing") {
                    const days = a.trial_days_left;
                    const trialClass = (days !== null && days <= 0) ? "trial-expired" : "trial-ok";
                    const trialText = (days !== null)
                        ? (days <= 0 ? "trial expired" : `${days} day${days === 1 ? "" : "s"} left`)
                        : "trial";
                    subHtml = `<span class="sub-trialing">Trialing</span><br><span class="${trialClass}">${trialText}</span>`;
                } else if (a.subscription_status === "cancelled") {
                    subHtml = `<span class="sub-cancelled">Cancelled</span>`;
                } else {
                    subHtml = `<span class="sub-active">${(a.subscription_status || "active").replace(/^\w/, c => c.toUpperCase())}</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${a.id}</strong></td>
                        <td>${a.name}<br><span style="font-size:11px; color:#64748b;">${a.assistant_name || "AI Assistant"}</span></td>
                        <td>${a.owner_name || "—"}</td>
                        <td>${a.email}</td>
                        <td><span class="tier-pill tier-${tier}">${tier}</span></td>
                        <td>${subHtml}</td>
                        <td>${a.lead_count}</td>
                        <td>${a.appointment_count}</td>
                        <td>${a.agent_count}</td>
                        <td>${createdDate}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteAgency(${a.id})">🗑️ Delete</button>
                        </td>
                    </tr>
                `;
            });
        }
    } catch (error) {
        loading.innerHTML = "❌ Failed to load agencies";
        console.error("Error loading agencies:", error);
    }
}

async function createAgency() {
    const name = document.getElementById("name").value.trim();
    const assistant_name = document.getElementById("assistant_name").value.trim();
    const owner_name = document.getElementById("owner_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const prompt = document.getElementById("prompt").value.trim();
    
    if (!name || !email) {
        alert("❌ Agency Name and Email are required!");
        return;
    }
    
    const btnCreate = event.target;
    btnCreate.disabled = true;
    btnCreate.textContent = "⏳ Creating...";
    
    try {
        const res = await fetch("/create-agency", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                name,
                assistant_name: assistant_name || "AI Assistant",
                owner_name,
                email,
                whatsapp,
                prompt: prompt || "You are a luxury real estate assistant.",
                subscription_type: "Basic"
            })
        });
        
        const result = await res.json();
        
        if (res.ok) {
            const pwLine = result.temp_password
                ? `Temporary Password: ${result.temp_password}\n(Share this with the agency owner - it won't be shown again.)`
                : "The agency owner sets their own password.";
            alert(`✅ Agency created successfully!\n\nAgency ID: ${result.agency_id}\n${pwLine}`);

            // Clear form
            document.getElementById("name").value = "";
            document.getElementById("assistant_name").value = "";
            document.getElementById("owner_name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("whatsapp").value = "";
            document.getElementById("prompt").value = "You are a luxury real estate assistant.";
            
            // Reload table
            loadAgencies();
        } else {
            alert("❌ Error: " + (result.error || "Failed to create agency"));
        }
    } catch (error) {
        alert("❌ Network error. Please try again.");
        console.error("Error creating agency:", error);
    } finally {
        btnCreate.disabled = false;
        btnCreate.textContent = "✨ Create Agency";
    }
}

async function deleteAgency(id) {
    if (!confirm(`⚠️ Are you sure you want to delete Agency ID ${id}?\n\nThis will also delete all leads associated with this agency.`)) {
        return;
    }
    
    try {
        const res = await fetch(`/delete-agency/${id}`, {
            method: "DELETE"
        });
        
        if (res.ok) {
            alert("✅ Agency deleted successfully!");
            loadAgencies();
        } else {
            alert("❌ Failed to delete agency");
        }
    } catch (error) {
        alert("❌ Network error. Please try again.");
        console.error("Error deleting agency:", error);
    }
}

// Load agencies and overview stats on page load
loadPlatformStats();
loadAgencies();
</script>

</body>
</html>
