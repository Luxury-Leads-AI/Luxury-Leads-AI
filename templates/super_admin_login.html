<!DOCTYPE html>
<html>
<head>
  <title>Super Admin Login - Luxury Leads AI</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h3 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #38bdf8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0ea5e9;
    }
    .error-message {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

<div class="box">
  <h3>⚙️ Super Admin</h3>
  <p class="subtitle">Owner-only access</p>

  <div id="errorMessage" class="error-message"></div>

  <form method="POST">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter super admin password"
      required
      autofocus
    >

    <button type="submit">🔐 Login</button>
  </form>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');
  if (error) {
    const errorDiv = document.getElementById("errorMessage");
    errorDiv.textContent = "❌ " + decodeURIComponent(error);
    errorDiv.style.display = "block";
  }
});
</script>

</body>
</html>
