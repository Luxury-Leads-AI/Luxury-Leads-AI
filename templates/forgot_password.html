<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password - Luxury Leads AI</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    h3 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #38bdf8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #0ea5e9; }
    .message-box {
      background: #065f46;
      border: 1px solid #10b981;
      color: #d1fae5;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
    .links a {
      color: #38bdf8;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="box">
  <h3>🔑 Reset Your Password</h3>
  <p class="subtitle">Enter the email on your account and we'll send you a reset link</p>

  {% if message %}
  <div class="message-box">{{ message }}</div>
  {% else %}
  <form method="POST" action="/forgot-password">
    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required autofocus>
    <button type="submit">📧 Send Reset Link</button>
  </form>
  {% endif %}

  <div class="links">
    <a href="/owner-login">Agency owner login</a> &middot; <a href="/agent-login">Agent login</a>
  </div>
</div>

</body>
</html>
